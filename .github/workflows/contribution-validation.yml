name: Contribution validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.branch }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: codex/ipad-keyboard-trackpad
            sha: 2c606a847a734a1c7f36d4b9e5b4d307c53b2c26
          - branch: codex/display-mode-controls
            sha: 6d4962f5968e38208916c2132447f705b3ef323f
          - branch: codex/shared-settings-contribution
            sha: f64f286621b7d3f5fc13828028fa219158943d57
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Record exact revision
        run: git rev-parse HEAD
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run macOS tests
        run: >-
          xcodebuild test -project OpenSidecar.xcodeproj
          -scheme OpenSidecarMac -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Build macOS receiver
        run: >-
          xcodebuild build -project OpenSidecar.xcodeproj
          -scheme OpenSidecarMacReceiver -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Build iOS and iPadOS receiver
        run: >-
          xcodebuild build -project OpenSidecar.xcodeproj
          -scheme OpenSidecariOS -configuration Release
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
